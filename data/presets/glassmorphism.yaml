# ============================================================
# WARFRAME-RELIC 主题预设 — 玻璃拟态 (Glassmorphism)
# ============================================================
# 版本: 1.0
# 格式: Design Token 四层架构 (Raw → Alias → Semantic → Component)
#
# 设计特点:
#   - 半透明玻璃质感(背景带 10-30% 透明度)
#   - 柔和冷色调(蓝灰系,低饱和)
#   - 细边框 + 微妙阴影(取代发光)
#   - 无扫描线纹理
#
# 引用语法:
#   @path.to.token    — 引用另一个 token 的值
#   lighten(c, p%)    — 提亮颜色 c，百分比 p ∈ [0,100]
#   darken(c, p%)     — 加深颜色 c，百分比 p ∈ [0,100]
#   opacity(c, a)     — 设置透明度 a ∈ [0,1]
#   mix(a, b, w)      — 混合两色，权重 w ∈ [0,1]
# ============================================================

_meta:
  name: "glassmorphism"
  display_name: "玻璃拟态"
  description: "半透明玻璃质感，鲜亮冰蓝色调，透亮如冰"
  version: 1.1

# ═══════════════════════════════════════════════════
#  Layer 1: 原始色值（Raw Values）
#  最底层的物理颜色，所有上层 token 的最终来源。
# ═══════════════════════════════════════════════════
raw:
  # ---- 品牌主色（淡冰蓝，接近白色）----
  brand:
    yellow:  "#E3F2FD"    # 主强调色（极浅冰蓝）
    cyan:    "#B3E5FC"    # 信息色（淡青）
    magenta: "#D1C4E9"    # 特殊标记（淡紫）
    orange:  "#FFE0B2"    # 警告（淡橙）
    red:     "#FFCDD2"    # 错误（淡粉红）
    green:   "#C8E6C9"    # 成功（淡绿）

  # ---- 中性色阶梯（用于文字、边框、背景）----
  neutral:
    white:   "#FFFFFF"    # 主文字（纯白）
    light:   "#E3F2FD"    # 次要文字（极浅蓝）
    medium:  "#90CAF9"    # 辅助文字 / 占位符
    dark:    "#42A5F5"    # 禁用文字 / 弱边框
    black:   "#0D47A1"    # 最深背景（深蓝）

  # ---- 表面色（Surface Colors）----
  surface:
    base:    "#0D47A1"    # 最底层背景（深蓝）
    raised:  "#1565C0"    # 浮起面（卡片/弹窗）
    overlay: "#1976D2"    # 遮罩层（半透明使用）

  # ---- 业务语义色（游戏相关）----
  game:
    gold:    "#FDE68A"    # 遗物黄金稀有度（柔和金）
    silver:  "#E2E8F0"    # 遗物白银稀有度（浅银）
    copper:  "#FDBA74"    # 遗物青铜稀有度（柔和铜）
    unknown: "#94A3B8"    # 未知状态

  # ---- 外部品牌色 ----
  external:
    bilibili:      "#FB7299"
    bilibili_hover: "#FF8DB0"
    github:        "#58A6FF"
    github_hover:  "#79C0FF"

# ═══════════════════════════════════════════════════
#  Layer 2: 别名 / 调色板（Alias / Palette）
#  对 Raw 的语义化分组，方便 Semantic 层引用。
# ═══════════════════════════════════════════════════
alias:
  # 强调色系（柔和蓝白）
  accent:
    primary:   "@brand.yellow"      # #A8C7FA 柔和的蓝白
    secondary: "@brand.cyan"        # #7DD3FC 天蓝
    tertiary:  "@brand.magenta"     # #C4B5FD 淡紫

  # 语义色
  semantic:
    success: "@brand.green"         # #69F0AE
    danger:  "@brand.red"           # #FF8A80
    warning: "@brand.orange"        # #FFB74D
    info:    "@brand.cyan"          # #00E5FF

  # 中性色梯度（文字与边框）
  text:
    primary:  "@neutral.white"      # #FFFFFF
    secondary: "@neutral.light"     # #E3F2FD
    tertiary: "@neutral.medium"     # #90CAF9
    disabled: "@neutral.dark"       # #42A5F5
    inverse:  "@neutral.black"      # #0D47A1

  border:
    subtle:   "rgba(79, 195, 247, 0.15)"   # 极细边框（冰蓝）
    default:  "rgba(79, 195, 247, 0.25)"   # 细边框（冰蓝）
    emphasis: "@alias.accent.primary"
    focus:    "@alias.accent.secondary"

  # 背景色
  bg:
    base:     "@surface.base"       # #0D47A1
    raised:   "@surface.raised"     # #1565C0
    overlay:  "@surface.overlay"    # #1976D2

  # 渐变色（鲜亮冰蓝过渡）
  gradient:
    progress: ["@brand.cyan", "@brand.yellow", "@brand.magenta"]

  # 日志级别色
  log:
    ok:    "@brand.green"
    warn:  "@brand.orange"
    error: "@brand.red"
    info:  "@neutral.light"

  # 稀有度色
  rarity:
    gold:   "@raw.game.gold"
    silver: "@raw.game.silver"
    copper: "@raw.game.copper"

  # 来源类型色
  source_type:
    mission:   "@brand.cyan"
    bounty:    "@brand.orange"
    sortie:    "@brand.red"
    key:       "@brand.green"
    transient: "@brand.magenta"
    syndicate: "@brand.yellow"

# ═══════════════════════════════════════════════════
#  Layer 3: 语义令牌（Semantic Tokens）
#  面向全应用的全局语义角色，任何组件都可以引用。
# ═══════════════════════════════════════════════════
semantic:
  # ---- 全局交互状态 ----
  state:
    normal:
      bg:      "rgba(13, 71, 161, 0.35)"        # 玻璃质感：35% 冰蓝
      text:    "@text.primary"
      border:  "@border.default"
    hover:
      bg:      "rgba(13, 71, 161, 0.50)"        # hover 时稍深
      text:    "@accent.secondary"
      border:  "@accent.primary"
    pressed:
      bg:      "rgba(13, 71, 161, 0.65)"        # pressed 更深
      text:    "@accent.primary"
      border:  "@accent.secondary"
    focused:
      border:  "@border.focus"
      glow:    "@accent.secondary"
    disabled:
      bg:      "rgba(13, 71, 161, 0.20)"        # 禁用更淡
      text:    "@text.disabled"
      border:  "rgba(79, 195, 247, 0.10)"
    selected:
      bg:      "@accent.primary"
      text:    "@bg.base"
      border:  "@accent.primary"

  # ---- 重要性等级 ----
  priority:
    high:   "@semantic.danger"
    medium: "@semantic.warning"
    low:    "@semantic.info"
    muted:  "@text.tertiary"

# ═══════════════════════════════════════════════════
#  Layer 4: 组件令牌（Component Tokens）
#  每个组件类型独享的颜色槽位，仅限该组件内部使用。
# ═══════════════════════════════════════════════════
components:
  # ---- 按钮 (CyberButton) ----
  button:
    solid:
      fill:         "rgba(227, 242, 253, 0.35)"    # 玻璃质感：35% 极浅冰蓝
      text:         "@text.primary"
      border:       "rgba(227, 242, 253, 0.50)"    # 细边框
      corner_size:  8
      glow_size:    0                              # 无发光
      glow_opacity: 0
    outlined:
      fill:         "transparent"
      text:         "@accent.secondary"
      border:       "rgba(179, 229, 252, 0.40)"    # 细边框
      corner_size:  8
      glow_size:    0
      glow_opacity: 0
    ghost:
      fill:         "transparent"
      text:         "@text.secondary"
      border:       "@border.subtle"
      corner_size:  8
      glow_size:    0
    ghost_hover:
      fill:         "rgba(227, 242, 253, 0.20)"
      text:         "@text.primary"
      border:       "@border.subtle"
    solid_hover:
      fill:         "rgba(227, 242, 253, 0.45)"    # hover 稍深
      text:         "@text.primary"
      border:       "rgba(227, 242, 253, 0.60)"
    solid_pressed:
      fill:         "rgba(227, 242, 253, 0.55)"    # pressed 更深
      text:         "@text.primary"
      border:       "rgba(227, 242, 253, 0.70)"
    outlined_pressed:
      fill:         "rgba(179, 229, 252, 0.30)"
      text:         "@accent.secondary"
      border:       "rgba(179, 229, 252, 0.50)"
    outlined_hover:
      fill:         "rgba(179, 229, 252, 0.25)"
      text:         "@accent.secondary"
      border:       "rgba(179, 229, 252, 0.45)"
    ghost_pressed:
      fill:         "rgba(227, 242, 253, 0.30)"
      text:         "@text.primary"
      border:       "@border.default"

  # ---- 面板容器 (CyberPanel) ----
  panel:
    bg:            "rgba(227, 242, 253, 0.30)"      # 玻璃质感：30% 极浅冰蓝
    bg_opacity:    0.30
    border:        "@border.default"
    border_width:  1
    corner_size:   12
    glow_color:    "@accent.secondary"
    glow_opacity:  0                              # 无发光
    title_bar:
      bg:          "transparent"
      text:        "@accent.primary"
      underline:   "@accent.primary"
      icon_color:  "@accent.primary"
    corner_decor:
      color:       "@accent.primary"
      length:      12
      thickness:   2

  # ---- 对话框 (CyberDialog) ----
  dialog:
    bg:             "rgba(227, 242, 253, 0.55)"     # 稍深，确保可读性
    bg_opacity:     0.55
    border:         "rgba(179, 229, 252, 0.40)"    # 细边框
    border_width:   1
    corner_size:    14
    shadow_blur:    40                            # 柔和阴影
    shadow_opacity: 0.25
    title_text:     "@text.primary"
    body_text:      "@text.secondary"

  # ---- 卡片 (CyberCard) ----
  card:
    bg:            "rgba(227, 242, 253, 0.25)"      # 玻璃质感：25% 极浅冰蓝
    border:        "@border.default"
    border_width:  1
    corner_size:   8
    padding_h:     16
    padding_v:     12

  # ---- 输入框 (CyberLineEdit) ----
  input:
    bg:            "rgba(227, 242, 253, 0.35)"      # 稍深，突出输入区
    text:          "@text.primary"
    placeholder:   "@text.tertiary"
    border:        "@border.default"
    border_focus:  "@accent.primary"
    corner_size:   6

  # ---- 下拉框 (CyberComboBox) ----
  combo_box:
    bg:            "rgba(227, 242, 253, 0.40)"      # 玻璃质感：40% 极浅冰蓝
    text:          "@text.primary"
    border:        "@border.default"
    border_focus:  "@accent.primary"
    corner_size:   6

  # ---- 开关 (CyberToggleSwitch) ----
  toggle:
    track_bg:      "rgba(227, 242, 253, 0.35)"      # 玻璃质感：35% 极浅冰蓝
    track_border:  "@border.default"
    thumb_bg:      "@accent.primary"
    thumb_border:  "@accent.secondary"
    corner_size:   4

  # ---- 滑块 (CyberSlider) ----
  slider:
    track_bg:      "rgba(227, 242, 253, 0.40)"      # 稍深，突出滑块区
    track_border:  "@border.subtle"
    fill:          "@accent.primary"
    thumb_bg:      "@accent.secondary"
    thumb_border:  "@accent.primary"
    corner_size:   4

  # ---- 进度条 (CyberProgressBar) ----
  progress:
    track_bg:      "rgba(227, 242, 253, 0.35)"
    track_border:  "@border.subtle"
    fill_gradient: "@gradient.progress"
    corner_size:   4
    text:          "@text.primary"

  # ---- 列表项 (CyberListItem) ----
  list_item:
    bg_normal:     "transparent"
    bg_hover:      "rgba(179, 229, 252, 0.25)"
    bg_selected:   "@accent.primary"
    text_normal:   "@text.primary"
    text_selected: "@bg.base"
    border:        "@border.subtle"
    corner_size:   6

  # ---- 标签 / 徽章 (CyberLabel / Badge) ----
  label:
    text:        "@text.secondary"
    badge_bg:    "@accent.secondary"
    badge_text:  "@bg.base"
    badge_corner: 4

  # ---- 覆盖层 (Overlay) ----
  overlay:
    bg_rgba:       [227, 242, 253, 180]             # 极浅冰蓝半透明
    selection:     [227, 242, 253, 120]
    panel_overlay: [227, 242, 253]

  # ---- 导航栏 (Navigation) ----
  nav:
    item_bg:         "rgba(209, 232, 248, 0.25)"    # 玻璃质感：25% 淡冰蓝
    item_text:       "@text.tertiary"
    item_hover_bg:   "@item_bg"
    item_hover_text: "@text.primary"
    item_selected_bg: "@accent.primary"
    item_selected_text: "@bg.base"
    divider:         "@border.subtle"

  # ---- 滚动条 (ScrollBar) ----
  scrollbar:
    track_bg:      "rgba(227, 242, 253, 0.20)"      # 玻璃质感：20% 极浅冰蓝
    thumb_bg:      "rgba(227, 242, 253, 0.40)"     # 玻璃质感：40% 极浅冰蓝
    thumb_hover:   "rgba(227, 242, 253, 0.60)"     # hover 稍深
    thumb_pressed: "rgba(227, 242, 253, 0.80)"     # pressed 更深
    corner_size:   4

  # ---- 复选框 (CheckBox) ----
  checkbox:
    bg:            "rgba(227, 242, 253, 0.35)"      # 玻璃质感：35% 极浅冰蓝
    border:        "@border.default"
    border_focus:  "@accent.primary"
    check_color:   "@accent.primary"
    corner_size:   4

  # ---- 单选框 (RadioButton) ----
  radio:
    bg:            "rgba(227, 242, 253, 0.35)"      # 玻璃质感：35% 极浅冰蓝
    border:        "@border.default"
    border_focus:  "@accent.primary"
    check_color:   "@accent.primary"
    corner_size:   4

# ═══════════════════════════════════════════════════
#  空间与尺寸令牌（Design Space Tokens）
#  基于 4px 基准网格，所有尺寸必须是 4 的倍数。
# ═══════════════════════════════════════════════════
space:
  # ---- 间距阶梯（Spacing Scale）----
  spacing:
    none:  0
    xs:    4
    sm:    8
    md:    12
    lg:    16
    xl:    20
    xxl:   24
    xxxl:  32

  # ---- 控件高度（Control Heights）----
  height:
    input_sm:   28
    input_md:   36
    input_lg:   44
    btn_sm:     28
    btn_md:     36
    btn_lg:     44
    btn_icon:   32
    nav_item:   36
    list_item:  44
    card_min:   60
    toggle_sw:  24
    progress:   10
    scrollbar:  10
    badge:      20
    tooltip_arrow: 8

  # ---- 圆角 / 切角尺寸（Corner Sizes）----
  corner:
    xs:   4
    sm:   6
    md:   8
    lg:   12
    xl:   14

  # ---- 边框宽度（Border Widths）----
  border:
    none:  0
    thin:  1
    medium: 1.5
    thick: 2

  # ---- 字体族（Font Families）----
  font_family:
    display:   ["Orbitron", "Rajdhani", "Exo 2", "Microsoft YaHei UI", sans-serif]
    body:      ["Rajdhani", "Exo 2", "Segoe UI", "Microsoft YaHei UI", sans-serif]
    mono:      ["Share Tech Mono", "Consolas", "Courier New", monospace]
    decorative: ["Chakra Petch", "Orbitron", "Microsoft YaHei UI", sans-serif]

  # ---- 字体大小（Font Sizes）----
  font:
    xxs:    9
    micro:  10
    xs:     11
    sm:     12
    sm_md:  13
    md:     14
    md_lg:  15
    lg:     16
    lg_xl:  18
    xl:     20
    xxl:    24
    display: 32

  # ---- 按钮字号（Button Font Sizes）----
  font_size:
    sm:   10

  # ---- 图标尺寸（Icon Sizes）----
  icon:
    sm:  16
    md:  20
    lg:  24
    xl:  32

  # ---- 发光效果（Glow Effects）----
  glow:
    none:  0
    subtle: 2
    sm:    4
    md:    6
    lg:    10

  # ---- 动画时长（Animation Durations, ms）----
  duration:
    fast:    150
    normal:  250
    slow:    400
    page:    350

  # ---- 导航标签（赛博朋克风格 Nav Tab）----
  nav:
    bar_width:         10
    bar_width_selected: 10
    bar_gap:            4
    corner_br:          16
    inner_pad:          16
    font_size:          11
    border:             "@accent.secondary"
    bg:                 "rgba(209, 232, 248, 0.25)"   # 玻璃质感：25% 淡冰蓝
    bar:                "@accent.secondary"
    bar_selected:       "@accent.secondary"
    text:               "@text.primary"
    glow:
      enabled: false          # 玻璃风无发光
      spread:   0
      alpha:    0

  # ---- 扫描线纹理（全局横纹叠加）----
  scanline:
    enabled: false          # 玻璃风无扫描线
    spacing: 2
    alpha:   0
    color:   "#000000"

